name: Publish

on:
  schedule:
    - cron: "0 16 * * *"
  push:
    tags:
      - "present-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Stable version. Empty publishes the nightly build instead
        required: false
        default: ""
        type: string
      publish:
        description: Publish the packages to npm
        required: true
        default: false
        type: boolean

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: ver
        run: |
          channel=nightly
          publish=false
          version="0.0.0-nightly.$(date -u +%Y%m%d%H%M%S)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            channel=stable
            version="${GITHUB_REF_NAME#present-v}"
            publish=true
          elif [ -n "${{ inputs.version }}" ]; then
            channel=stable
            version="${{ inputs.version }}"
            publish="${{ inputs.publish }}"
          elif [ "${{ inputs.publish }}" = "true" ]; then
            publish=true
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*|[0-9]*.[0-9]*.[0-9]*-nightly.[0-9]*) ;;
            *) echo "bad version: $version" && exit 1 ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Build
        run: node scripts/build-all.mjs

      - name: Stamp version
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, readdirSync, statSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const version = process.env.VERSION;
          for (const suite of ["present", "document", "sheet"]) {
            for (const name of readdirSync(suite)) {
              const dir = join(suite, name);
              if (!statSync(dir).isDirectory()) continue;
              const path = join(dir, "package.json");
              const pkg = JSON.parse(readFileSync(path, "utf8"));
              pkg.version = version;
              for (const field of ["dependencies", "devDependencies", "peerDependencies"]) {
                for (const [dep, spec] of Object.entries(pkg[field] ?? {})) {
                  if (dep.startsWith("@sliiu/") && spec === "workspace:*") pkg[field][dep] = version;
                }
              }
              writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            }
          }
          EOF
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Check the packages
        if: steps.ver.outputs.publish == 'true'
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";
          const isTsSource = (value) =>
            typeof value === "string" && value.endsWith(".ts") && !value.endsWith(".d.ts");
          for (const suite of ["present", "document", "sheet"]) {
            for (const name of readdirSync(suite)) {
              const pkg = JSON.parse(readFileSync(join(suite, name, "package.json"), "utf8"));
              if (pkg.private) {
                console.error(`${pkg.name} is private`);
                process.exit(1);
              }
              const text = JSON.stringify(pkg);
              if (text.includes("workspace:")) {
                console.error(`${pkg.name} still has a workspace dependency`);
                process.exit(1);
              }
              for (const [key, value] of Object.entries(pkg.exports ?? {})) {
                if (typeof value === "string") {
                  if (isTsSource(value)) {
                    console.error(`${pkg.name} ${key} still points at TypeScript`);
                    process.exit(1);
                  }
                  continue;
                }
                for (const field of ["types", "import", "require"]) {
                  if (typeof value[field] !== "string" || isTsSource(value[field])) {
                    console.error(`${pkg.name} ${key} missing ${field}`);
                    process.exit(1);
                  }
                }
              }
            }
          }
          EOF

      - name: Publish to npm
        if: steps.ver.outputs.publish == 'true'
        run: |
          npm install -g npm@^11.5.1
          # 空的 _authToken 会挡住 OIDC。
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
          order="present/animation present/core present/parser present/plugin-sdk present/three-bake present/renderer present/transition-fx present/player present/themes present/ui present/editor present/serializer present/ai document/core document/renderer document/editor document/parser document/serializer sheet/core sheet/parser sheet/renderer sheet/serializer"
          tag=latest
          if [ "${{ steps.ver.outputs.channel }}" != "stable" ]; then tag=nightly; fi
          failed=
          for name in $order; do
            log=$(mktemp)
            if npm publish "$name" --access public --tag "$tag" >"$log" 2>&1; then
              cat "$log"
            elif grep -q "previously published" "$log"; then
              echo "skip $name (already published)"
              cat "$log"
            else
              echo "fail $name"
              cat "$log"
              failed="$failed $name"
            fi
            rm -f "$log"
          done
          if [ -n "$failed" ]; then
            echo "not published:$failed"
            exit 1
          fi
